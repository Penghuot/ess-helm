server_name: "${SYNAPSE_SERVER_NAME}"
public_baseurl: "${SYNAPSE_PUBLIC_BASEURL}"
pid_file: /data/homeserver.pid

listeners:
  - port: 8008
    tls: false
    type: http
    x_forwarded: true
    bind_addresses: ["0.0.0.0"]
    resources:
      - names: [client, federation]
        compress: false

database:
  name: psycopg2
  args:
    user: "${SYNAPSE_DB_USER}"
    password: "${SYNAPSE_DB_PASSWORD}"
    host: "${SYNAPSE_DB_HOST}"
    port: ${SYNAPSE_DB_PORT}
    database: "${SYNAPSE_DB_NAME}"
    cp_min: 5
    cp_max: 10

macaroon_secret_key: "${SYNAPSE_MACAROON_SECRET_KEY}"
form_secret: "${SYNAPSE_FORM_SECRET}"

enable_registration: false
enable_registration_without_verification: false

experimental_features:
  msc3861:
    enabled: true
    issuer: "${MAS_MATRIX_ENDPOINT}"
    client_id: "${MAS_CLIENT_ID}"
    client_auth_method: client_secret_basic
    client_secret: "${MAS_CLIENT_SECRET}"
    admin_token: "${MAS_MATRIX_SHARED_SECRET}"
