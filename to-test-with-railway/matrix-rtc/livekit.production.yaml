port: 7880
bind_addresses:
  - "0.0.0.0"

rtc:
  port_range_start: 50000
  port_range_end: 60000
  use_external_ip: true
  # TCP fallback for Railway (no UDP support)
  tcp_port: 7881

redis:
  # Using in-memory mode for Railway (single instance)
  # For production, use external Redis

keys:
  ${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}

logging:
  level: info

# Room settings
room:
  auto_create: true
  empty_timeout: 300
  max_participants: 20

# WebRTC settings
turn:
  enabled: false # Using TCP fallback for Railway

