http:
  public_base: "https://mas-service-production.up.railway.app"
  listeners:
    - name: web
      binds:
        - address: "0.0.0.0:8080"
      proxy_protocol: false
      resources:
        - name: discovery
        - name: human
        - name: oauth
        - name: compat
        - name: graphql
        - name: assets

database:
  uri: "${DATABASE_URL}"

upstream_oauth2:
  endpoint: "https://synapse-production-e979.up.railway.app/_synapse/oidc/callback"
  registration_shared_secret: "${REGISTRATION_SHARED_SECRET}"

secrets:
  encryption: "${MAS_ENCRYPTION_SECRET}"
  keys:
    - kid: "${MAS_KEY_ID}"
      key: "${MAS_SIGNING_KEY}"

email:
  from: '"Matrix" <noreply@synapse-production-e979.up.railway.app>'
  reply_to: '"Matrix Support" <support@synapse-production-e979.up.railway.app>'
  transport: blackhole
