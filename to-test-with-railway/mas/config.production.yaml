http:
  public_base: "${MAS_PUBLIC_BASE}"
  listeners:
    - name: web
      binds:
        - address: "0.0.0.0:8080"
      resources:
        - name: discovery
        - name: human
        - name: oauth
        - name: compat
        - name: graphql
        - name: assets

database:
  uri: "${MAS_DATABASE_URI}"

matrix:
  homeserver: "${MAS_MATRIX_HOMESERVER}"
  endpoint: "${MAS_MATRIX_ENDPOINT}"
  secret: "${MAS_MATRIX_SHARED_SECRET}"

clients:
  - client_id: "${MAS_CLIENT_ID}"
    client_auth_method: "client_secret_basic"
    client_secret: "${MAS_CLIENT_SECRET}"
    redirect_uris:
      - "${MAS_MATRIX_ENDPOINT}/_synapse/client/oidc/callback"
      - "${MAS_MATRIX_ENDPOINT}/_synapse/client/login/sso/redirect"

secrets:
  encryption: "${MAS_ENCRYPTION_KEY}"
  keys:
    - kid: "default"
      key: |
        ${MAS_SIGNING_KEY}

passwords:
  enabled: true
  schemes:
    - version: 1
      algorithm: argon2id

account:
  password_registration_enabled: true
  password_registration_email_required: false
  email_verification: disabled

branding:
  service_name: "RMSS Auth"
