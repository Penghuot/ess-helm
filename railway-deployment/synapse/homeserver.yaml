server_name: "synapse.up.railway.app"
public_baseurl: "https://synapse.up.railway.app/"

report_stats: false

database:
  name: psycopg2
  args:
    user: synapse
    password: ${POSTGRES_PASSWORD}
    host: ${POSTGRES_HOST}
    port: ${POSTGRES_PORT}
    database: ${POSTGRES_DB}

secrets:
  registration_shared_secret: ${REGISTRATION_SHARED_SECRET}
  signing_key_path: "/data/synapse.signing.key"
